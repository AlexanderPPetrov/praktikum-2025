<body>
    <header>
        <h1>Welcome to My Website</h1>
    </header>
    <section>
        <p>Това е текст в параграф</p>
        <div>
            <div>
                <div>
                    <div>
                        <span>
                            <b>Малко текст</b>

    <h2>Нещо по-маловажно</h2>

    <form action="/action_page.php">
        <fieldset>
            <input id="male" type="radio" value="male" name="gender">
            <label for="male">Мъж</label>
            <input id="female" type="radio" value="female" name="gender">
            <label for="female">Жена</label>
        </fieldset>
        <fieldset>
            <input id="subscribe" type="checkbox" checked>
            <label for="subscribe">Искам да получавам съобщения за промоции</label>
        </fieldset>
        <fieldset>
            <label for="select-country">Избери държава</label>
            <select id="select-country">
                <option value="bg">България</option>
                <option value="tr">Турция</option>
                <option value="gr">Гърция</option>
            </select>
        </fieldset>
        
        <label for="fname">First name:</label><br>
        <input type="text" 
               id="fname" 
               name="fname" 
               value="John"
               placeholder="Въведи име"
               ><br>
        
        <label for="lname">Last name:</label><br>
        <input type="text" 
               id="lname" 
               name="lname"
               value="Doe"
               placeholder="Въведи фамилия"
               >
               <br><br>
        
        <input type="submit" value="Submit">
    </form>
